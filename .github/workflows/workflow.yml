name: Update

on:
  push:
    branches:
      - master

  schedule:
    - cron: '0 2 * * *'

  pull_request:
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  WODBOT_GITHUB_PAT: ${{ secrets.WODBOT_GITHUB_PAT }}
  WODBOT_GITHUB_USERNAME: ${{ secrets.WODBOT_GITHUB_USERNAME }}
  WODBOT_GIT_EMAIL: ${{ secrets.WODBOT_GIT_EMAIL }}
  WODBOT_GIT_NAME: ${{ secrets.WODBOT_GIT_NAME }}

jobs:
  tooling:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        script: [ gotpl ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions
        with:
          dir: repos
          script: ${{ matrix.script }}
  alpine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        script: [ mariadb,nginx,opensmtpd,vinyl,squid ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions
        with:
          dir: alpine
          script: ${{ matrix.script }}
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        script: [ alpine,apache,memcached,node,php,postgres,python,go,redis,valkey,ruby,rabbitmq ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions
        with:
          dir: images
          script: ${{ matrix.script }}
  stability-tags:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        script: [ drupal-php,wordpress-php,matomo-php,webgrind-php,laravel-php,drupal,wordpress,xhprof,drupal-cms ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions
        with:
          dir: stability-tags
          script: ${{ matrix.script }}
  upstream:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        script: [ adminer,cachet,drupal,mariadb,matomo,nginx,webgrind,wordpress,xhprof,drupal-cms,solr,zookeeper,openclaw,prometheus,vinyl ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions
        with:
          dir: upstream
          script: ${{ matrix.script }}
  docker4x:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        script: [ drupal,php,python,ruby,wordpress,laravel ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions
        with:
          dir: docker4x
          script: ${{ matrix.script }}
  notify:
    name: Notify Report Events
    needs:
      - tooling
      - alpine
      - images
      - stability-tags
      - upstream
      - docker4x
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Report Artifacts
        id: download-reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: reports

      - name: Generate Image Update Report
        run: |
          python scripts/image_update_report.py \
            --readme README.md \
            --events-dir reports \
            --output-dir image-update-report

      - name: Upload Consolidated Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-update-report
          path: image-update-report
          if-no-files-found: warn
          retention-days: 14

      - name: Send Email Digest
        env:
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
        run: |
          python scripts/image_report_email.py image-update-report \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --event "${{ github.event_name }}" \
            --sha "${{ github.sha }}" \
            --workflow-result "tooling=${{ needs.tooling.result }}, alpine=${{ needs.alpine.result }}, images=${{ needs.images.result }}, stability-tags=${{ needs['stability-tags'].result }}, upstream=${{ needs.upstream.result }}, docker4x=${{ needs.docker4x.result }}" \
            --artifact-result "${{ steps.download-reports.outcome }}"
